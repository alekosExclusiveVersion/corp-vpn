# ==========================================================
# Единый источник корпоративных сетей Tradesoft.
# Этот файл — ОДНО место, из которого берут данные:
#   1) corp-vpn-routes.sh  — ppp-маршруты L2TP (install.sh)
#   2) karing-rules.sh     — direct-правила для Karing
# Меняйте сети ТОЛЬКО здесь, затем перезапустите демон
# и пересинхронизируйте правила Karing.
# ==========================================================

# VPN-сервисы macOS, через которые ходит корпоративная сеть
CORP_SERVICES="vpn2-ts vpn3-ts vpn4-ts"

# Суффиксы доменов корпоративной зоны (поддомены тоже попадают)
DOMAIN_SUFFIX=".tradesoft.ru .tradesoft.pro .tradesoft.corp .prj .master.systest.php7"

# Точные домены корпоративной зоны
DOMAINS="sup5.tradesoft.corp www.projects.prj projects.prj servicedesk-report.office.tradesoft.ru"

# Подсети корпоративной сети (идут через ppp при подключённом L2TP)
NET_ROUTES="10.0.0.0/8 192.168.0.0/16"
# Корп. DNS-серверы: при активном VPN маршрутизируются строго через ppp0
# (/32 в обход устаревшего маршрута en0), иначе резолвинг корп. доменов не работает.
DNS_HOSTS="192.168.0.210 192.168.0.220"
# VPN-серверы корп. L2TP/IPSec (по доменам vpn1/vpn2/vpn3/vpn4.tradesoft.ru).
# Обязательно маршрутизировать напрямую (не через Karing/utun), иначе IPSec не установится.
VPN_SERVERS="109.194.204.122 178.141.80.30 109.194.204.125"

# Локальные подсети, которые НЕ должны уходить в корп. туннель (домашняя сеть,
# роутер, принтеры и т.п.). Указываются в формате CIDR. Дополнительно
# corp-vpn-routes.sh автоматически сохраняет подсети всех физических
# интерфейсов (en0/en1/...) — это работает и при смене Wi-Fi/подсети.
LOCAL_ROUTES="192.168.31.0/24"

# ПИЛОТ: дискриминатор «корп vs хотспот телефона».
# Хотспот телефона раздаёт ту же 192.168.128.0/24 и тот же IP, что корп. Wi-Fi,
# поэтому по IP сети их не различить. Логика is_corp_wifi() (vpn-watchdog.sh и
# corp-wifi-routes.sh) считает сеть корп. по совпадению ОДНОГО из признаков ниже,
# а пилот-строка (logger "corp-vpn: pilot ...") пишется при смене вердикта.
#
# НАДЁЖНЫЙ признак (подтверждён 08.09): macOS задаёт per-network ПРИВАТНЫЙ
# MAC для en0, стабильный для каждой сети/SSID и мгновенно меняющийся при
# переключении:
#   корп Wi-Fi:   b6:be:0c:d5:9a:24   (28 снимков логгера)
#   хотспот:      3e:e9:15:74:f3:be   (11 снимков логгера)
#   дом Wi-Fi:    12:3b:85:c4:1d:f0   (проверено 09.09.2026, 192.168.31.0/24)
#
# Вторичный признак — ARP-MAC шлюза (на хотспоте не резолвится: incomplete).
# Эталон корп: 192.168.128.1 at 54:b8:a:cf:80:0 (RouterARPVerified=TRUE).
# Эталон дом:  192.168.31.1 at ec:41:18:ec:c6:18 (проверено 09.09.2026).
# Ранняя запись b6:be:c:d5:9a:24 из старых скриптов — приватный MAC корп-сети
# en0 (не шлюз), она же и есть корп-эталон выше.
CORP_WIFI_EN0_MACS="b6:be:0c:d5:9a:24"
CORP_WIFI_GATEWAY_MACS="54:b8:a:cf:80:0"

# MySQL-серверы (каждый превращается в /32-маршрут через ppp)
MYSQL_HOSTS="p7ru1.tradesoft.ru p7ru2.tradesoft.ru p7ru3.tradesoft.ru p7ru4.tradesoft.ru p7ru5.tradesoft.ru p7ru8.tradesoft.ru p5g21.tradesoft.ru p5g25.tradesoft.ru p5g29.tradesoft.ru ext4.tradesoft.ru p5ru3.tradesoft.ru eurotradeplus.tradesoft.ru btk66-msk.tradesoft.ru kz1.tradesoft.ru demo203.auto-vision.ru"

# Критичные бизнес-домены (админки), резолвятся ПЕРВЫМИ в пересборке маршрутов:
# длинный SITE_DOMAINS-список (~288 доменов) занимает 40+с последовательного
# резолва, а parts-opt.com должен быть пинован через ppp сразу после DNS.
SITE_CRITICAL="parts-opt.com www.parts-opt.com api.parts-catalogs.com"

