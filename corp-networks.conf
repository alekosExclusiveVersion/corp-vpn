# ==========================================================
# Единый источник корпоративных сетей Tradesoft.
# Этот файл — ОДНО место, из которого берут данные:
#   1) corp-vpn-routes.sh  — ppp-маршруты L2TP (install.sh)
#   2) karing-rules.sh     — direct-правила для Karing
# Меняйте сети ТОЛЬКО здесь, затем перезапустите демон
# и пересинхронизируйте правила Karing.
# ==========================================================

# VPN-сервисы macOS, через которые ходит корпоративная сеть
CORP_SERVICES="vpn2-ts vpn3-ts vpn4"

# Суффиксы доменов корпоративной зоны (поддомены тоже попадают)
DOMAIN_SUFFIX=".tradesoft.ru .tradesoft.pro .tradesoft.corp .prj .master.systest.php7"

# Точные домены корпоративной зоны
DOMAINS="sup5.tradesoft.corp www.projects.prj projects.prj servicedesk-report.office.tradesoft.ru"

# Подсети корпоративной сети (идут через ppp при подключённом L2TP)
NET_ROUTES="10.0.0.0/8 192.168.0.0/16"

# Локальные подсети, которые НЕ должны уходить в корп. туннель (домашняя сеть,
# роутер, принтеры и т.п.). Указываются в формате CIDR. Дополнительно
# corp-vpn-routes.sh автоматически сохраняет подсети всех физических
# интерфейсов (en0/en1/...) — это работает и при смене Wi-Fi/подсети.
LOCAL_ROUTES="192.168.31.0/24"

# MySQL-серверы (каждый превращается в /32-маршрут через ppp)
MYSQL_HOSTS="p7ru1.tradesoft.ru p7ru2.tradesoft.ru p7ru3.tradesoft.ru p7ru4.tradesoft.ru p7ru5.tradesoft.ru p7ru8.tradesoft.ru p5g21.tradesoft.ru p5g25.tradesoft.ru p5g29.tradesoft.ru ext4.tradesoft.ru p5ru3.tradesoft.ru eurotradeplus.tradesoft.ru btk66-msk.tradesoft.ru kz1.tradesoft.ru demo203.auto-vision.ru"

