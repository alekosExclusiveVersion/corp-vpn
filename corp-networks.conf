# Хосты для проверки живости туннеля (host:port), доступны только через L2TP
PROBE_HOSTS="sup5.tradesoft.corp:4000 projects.prj:80 servicedesk-report.office.tradesoft.ru:443"

# Критичные корп. хосты по IP (RDP/рабочие станции): /32-маршрут через ppp
# ставится сразу при подъёме туннеля, без резолва. Защищает от перехвата
# пинами Karing (utun), который иначе чёрной дырой глушит RDP.
PROTECT_HOSTS="192.168.128.160 192.168.128.123"

# Хосты, РАЗРЕШЁННЫЕ ходить через параллельный туннель Tunnelblick
# (Правду_2А/Правду_2А_new): их /32-маршрут через utun НЕ вычищать в
# sweep_corp_hijacks. Приоритет у более специфичного /32 utun: он перебивает
# корп. /16 через ppp0 ровно для этих хостов, остальная 192.168.0.0/24 —
# через корп. сеть. Туннель для них добавляет маршрут директивой
# `route <ip> 255.255.255.255` в config.ovpn.
PARALLEL_TUNNEL_HOSTS="192.168.0.101"
